[package]
name = "xkeen-route"
version = "0.1.0"
edition = "2021"
description = "XKeen Route — веб-панель управления маршрутизацией Keenetic/Mihomo для Entware"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "sync",
    "io-util",
    "net",
    "time",
    "signal",
    "process",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "cookies",
] }

md5 = "0.8"
sha2 = "0.10"
hex = "0.4"
regex-lite = "0.1"
rust-embed = { version = "8", features = ["axum"] }
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
notify = "8"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

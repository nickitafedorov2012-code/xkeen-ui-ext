name: Build XKeen Route

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0)"
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build:
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            name: arm64-v8a
            rustflags: "-C target-feature=+crt-static"
          # TODO: mips/mipsel требуют nightly + muslsf (soft-float) — добавить позже:
          # - target: mipsel-unknown-linux-musl
          #   name: mips32le
          # - target: mips-unknown-linux-musl
          #   name: mips32
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Install cross
        run: type cross || cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Debug cargo metadata
        working-directory: backend
        run: |
          cargo metadata --filter-platform ${{ matrix.target }} --format-version 1 > /dev/null 2> meta.err || true
          {
            echo "=== cargo version ==="; cargo --version; rustc --version
            echo "=== installed targets ==="; rustup target list --installed
            echo "=== cargo metadata stderr ==="; cat meta.err
          } > debug.log 2>&1 || true

      - name: Upload debug info
        if: always()
        working-directory: backend
        run: |
          git config user.name "ci-log-bot"
          git config user.email "noreply@github.com"
          git checkout -f -B ci-log
          git add -f debug.log meta.err build.log 2>/dev/null || true
          git commit -m "ci: debug info" || true
          git push -f origin ci-log || true
          git checkout -f ${{ github.ref_name }}


      - name: Inject frontend dist for cross
        working-directory: backend
        run: |
          cp -r ../frontend/dist ./dist
          sed -i 's|\.\./frontend/dist|./dist|' src/frontend.rs

      - name: Build binary
        working-directory: backend
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          XKEEN_ROUTE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -o pipefail
          if ! cross build --release --target ${{ matrix.target }} 2>&1 | tee build.log; then
            echo "### ❌ Build failed (last 120 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          cp target/${{ matrix.target }}/release/xkeen-route ../xkeen-route-${{ matrix.name }}

      - name: Dump build log to ci-log branch (on failure)
        if: failure()
        working-directory: backend
        run: |
          git config user.name "ci-log-bot"
          git config user.email "noreply@github.com"
          git checkout -f -B ci-log
          git add -f build.log || true
          git commit -m "ci: build log for debugging" || true
          git push -f origin ci-log || true

      - uses: actions/upload-artifact@v4
        with:
          name: xkeen-route-${{ matrix.name }}
          path: xkeen-route-${{ matrix.name }}

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          prerelease: true
          files: artifacts/xkeen-route-*/*

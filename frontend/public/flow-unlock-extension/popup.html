<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow Unlocker — nickitafedorov2012</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="icon">🔓</span>
        <div class="brand-text">
          <span class="name">Flow <span class="highlight">Unlocker</span></span>
          <span class="sub">Google AI Sandbox Bypass</span>
        </div>
      </div>
      <span class="badge">v1.0.0</span>
    </header>

    <!-- Switch control card -->
    <div class="control-box">
      <div class="control-meta">
        <span class="control-label">Разблокировка Flow</span>
        <span class="control-hint">Обход проверки региона cPZSdc</span>
      </div>
      <label class="switch" for="enabled" title="Включить / отключить разблокировку">
        <input id="enabled" type="checkbox" role="switch" disabled>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Status display box -->
    <div class="status-box">
      <div id="status-dot" class="dot loading"></div>
      <div class="status-content">
        <div class="status-title">Статус плагина</div>
        <p id="status" role="status">Проверка статуса…</p>
      </div>
    </div>

    <!-- Error message banner -->
    <p id="error" role="alert" class="error-msg" hidden></p>

    <!-- Information tip -->
    <div class="info-note">
      <span class="info-icon">💡</span>
      <span>Внедряется в главный контекст (MAIN world) браузера и обеспечивает доступ к Flow без ограничений.</span>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="open" type="button" class="btn btn-primary">
        <span>🚀</span> Открыть Google Flow
      </button>
      <button id="reload" type="button" class="btn btn-secondary">
        <span>🔄</span> Перезагрузить вкладку Flow
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Автор: <a href="https://github.com/nickitafedorov2012-code" target="_blank" rel="noopener noreferrer">nickitafedorov2012</a></span>
      <span class="sep">•</span>
      <a href="https://github.com/nickitafedorov2012-code/xkeen-ui-ext" target="_blank" rel="noopener noreferrer">XKeen Route</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>

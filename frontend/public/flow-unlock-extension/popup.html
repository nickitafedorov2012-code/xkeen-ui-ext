<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow Unlocker — nickitafedorov2012</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand">🔓 Flow <span>Unlocker</span></div>
      <span class="badge">v2.1</span>
    </div>
    
    <div class="status-box">
      <div class="dot active"></div>
      <div class="status-text">
        <div class="status-title">Обход cPZSdc активен</div>
        <div class="status-desc">Русский интерфейс (ru-RU)</div>
      </div>
    </div>

    <p class="info">
      Расширение перехватывает RPC <code>cPZSdc</code>, снимает региональные ограничения Google Flow и включает русский язык.
    </p>

    <div class="actions">
      <button id="btnOpen" class="btn primary">🚀 Открыть Google Flow (RU)</button>
      <button id="btnReload" class="btn secondary">🔄 Перезагрузить страницу</button>
    </div>

    <footer>
      <span>Автор: <a href="https://github.com/nickitafedorov2012-code" target="_blank">nickitafedorov2012</a></span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>

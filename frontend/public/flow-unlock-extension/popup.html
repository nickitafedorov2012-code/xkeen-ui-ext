<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XKeen Flow Unlocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand">🛣️ XKeen <span>Flow</span></div>
      <span class="badge">v2.0</span>
    </div>
    
    <div class="status-box">
      <div class="dot active"></div>
      <div class="status-text">
        <div class="status-title">Обход cPZSdc активен</div>
        <div class="status-desc">Региональный фильтр Google отключён</div>
      </div>
    </div>

    <p class="info">
      Расширение автоматически перехватывает запросы к <code>batchexecute</code> и подменяет локаль на <code>en-US</code>.
    </p>

    <div class="actions">
      <button id="btnOpen" class="btn primary">🚀 Открыть Google Flow</button>
      <button id="btnReload" class="btn secondary">🔄 Обновить вкладку</button>
    </div>

    <footer>
      <span>Маршрутизация: <a href="http://192.168.1.1:1001" target="_blank">XKeen Route</a></span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
